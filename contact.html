<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Yusuf Abdurahman.">
  <title>Yusuf Abdurahman | Contact Me</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css" media="screen and (max-width: 767px)">
  <link rel="stylesheet" href="css/tablet.css" media="screen and (min-width: 768px) and (max-width: 1023px)">
  <link rel="stylesheet" href="css/laptop.css" media="screen and (min-width: 1024px)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="logo"><a href="index.html">Yusuf Abdurahman</a></div>
      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact Me</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" aria-labelledby="contact-heading">
      <div class="container">
        <h1 class="section-title" id="contact-heading">Contact Me</h1>
        <p class="section-intro">Send me your questions, comments or project ideas.</p>

        <!-- Validation uses only HTML5 attributes:
             required = field cannot be empty
             type="email" = must look like an email address
             pattern = text must match the pattern (phone: 10 digits)
             minlength / maxlength = limits on the number of characters -->
        <form class="contact-form" action="mailto:youremail@example.com" method="post" enctype="text/plain">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required minlength="2" maxlength="60"
                 pattern="[A-Za-z .'\-]{2,60}" title="Letters only, at least 2 characters" autocomplete="name">

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">

          <label for="phone">Cell No.</label>
          <input type="tel" id="phone" name="phone" required placeholder="905-555-1234"
                 pattern="[0-9]{3}[\- ]?[0-9]{3}[\- ]?[0-9]{4}"
                 title="10-digit phone number, like 905-555-1234" autocomplete="tel">

          <label for="comments">Comments</label>
          <textarea id="comments" name="comments" required minlength="10" maxlength="500"></textarea>

          <button type="submit" class="btn">Submit</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Contact: <a href="mailto:youremail@example.com">youremail@example.com</a></p>
      <p>&copy; 2026 Yusuf Abdurahman. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
